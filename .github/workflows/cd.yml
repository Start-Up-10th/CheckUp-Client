name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Dockerfile'
      - 'compose.prod.yaml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to school server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            exec 9>/tmp/checkup-web-deploy.lock
            if ! flock -n 9; then
              echo "ERROR: another deploy is running. Aborting."
              exit 1
            fi

            cd ~/CheckUp-Client

            OK_CODES="200 301 302 307 308"

            retry() {
              n=0
              until "$@"; do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then
                  return 1
                fi
                echo "retry $n/3: $*"
                sleep 5
              done
            }

            probe() {
              curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3000/ || true
            }

            wait_ready() {
              max=$1
              i=1
              while [ "$i" -le "$max" ]; do
                STATUS=$(probe)
                case " $OK_CODES " in
                  *" $STATUS "*)
                    sleep 5
                    STATUS2=$(probe)
                    case " $OK_CODES " in
                      *" $STATUS2 "*)
                        echo "Health check passed twice (status: $STATUS, $STATUS2)"
                        return 0
                        ;;
                    esac
                    echo "Passed once but failed on recheck (status: $STATUS2)"
                    ;;
                  *)
                    echo "Waiting for web... (attempt $i/$max, status: $STATUS)"
                    ;;
                esac
                sleep 6
                i=$((i+1))
              done
              return 1
            }

            rollback() {
              echo "=== Rolling back to $PREV_COMMIT ==="
              git reset --hard "$PREV_COMMIT"
              if [ -z "$PREV_IMAGE" ]; then
                echo "CRITICAL: no previous image. Manual recovery needed."
                return 0
              fi
              if ! sudo docker tag "$PREV_IMAGE" checkup-web-web:latest; then
                echo "CRITICAL: could not restore previous image tag."
                return 0
              fi
              sudo docker compose -f compose.prod.yaml up -d --no-build || true
              if wait_ready 10; then
                echo "Rollback OK: previous version is running."
              else
                echo "CRITICAL: rollback also failed health check."
              fi
            }

            echo "=== disk before ==="
            df -h /

            AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
            echo "available memory: ${AVAIL_MB}MB"
            if [ "$AVAIL_MB" -lt 1000 ]; then
              echo "ERROR: only ${AVAIL_MB}MB memory available. Build may be killed. Aborting before changing anything."
              exit 1
            fi

            AVAIL_GB=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
            if [ "$AVAIL_GB" -lt 6 ]; then
              echo "WARNING: only ${AVAIL_GB}GB free. Pruning docker cache..."
              sudo docker builder prune -af
              sudo docker image prune -f
              AVAIL_GB=$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')
              if [ "$AVAIL_GB" -lt 6 ]; then
                echo "ERROR: still only ${AVAIL_GB}GB free. Aborting before changing anything."
                exit 1
              fi
            fi

            PREV_COMMIT=$(git rev-parse HEAD)
            PREV_IMAGE=$(sudo docker inspect --format '{{.Image}}' checkup-web-web-1 2>/dev/null || true)
            echo "prev commit: $PREV_COMMIT"
            echo "prev image: ${PREV_IMAGE:-none}"

            retry git fetch origin main
            git checkout -q -f -B main origin/main

            if ! sudo docker compose -f compose.prod.yaml config -q; then
              echo "ERROR: compose.prod.yaml is invalid."
              git reset --hard "$PREV_COMMIT"
              exit 1
            fi

            if ! sudo docker compose -f compose.prod.yaml up -d --build; then
              echo "ERROR: docker compose build/up failed"
              rollback
              exit 1
            fi

            if wait_ready 20; then
              sudo docker builder prune -f --filter "until=72h" || true
              sudo docker image prune -f || true
              echo "=== disk after ==="
              df -h /
              echo "Deploy successful."
            else
              echo "=== web logs before rollback ==="
              sudo docker compose -f compose.prod.yaml logs web --tail 80 || true
              rollback
              exit 1
            fi